name: Publicar actualizador de Áurea para Windows

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar código del actualizador
        run: |
          node --check desktop/main.js
          node --check desktop/preload.js
      - name: Instalar dependencias
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Empaquetar y publicar nueva versión para Windows
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run release:win
      - name: Verificar instalador local
        shell: pwsh
        run: |
          $files = Get-ChildItem desktop/dist/*.exe -ErrorAction Stop
          if (-not $files) { throw 'El instalador no se generó' }
      - uses: actions/upload-artifact@v4
        with:
          name: Aurea-Windows-Actualizable
          path: desktop/dist/*.exe
          if-no-files-found: error
