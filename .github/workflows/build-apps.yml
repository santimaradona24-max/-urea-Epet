name: Compilar Áurea para Android y Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-web:
    name: Validar el código web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript
        run: |
          set -euo pipefail
          for js in web/assets/*.js desktop/main.js; do node --check "$js"; done
      - name: Verificar recursos de la interfaz
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('web/index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="(/assets/[^"]+)"', html)
          assert refs, 'Sin recursos estáticos'
          absent = [r for r in refs if not Path('web' + r).is_file()]
          assert not absent, 'Recursos faltantes: ' + repr(absent)
          print('Validación completada:', len(refs), 'recursos')
          PY

  android:
    needs: verificar-web
    name: Construir APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # El SDK Android ya viene preinstalado en ubuntu-latest.
      # setup-android@v3 intentaba instalar el paquete obsoleto 'tools'.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Comprobar resultado
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aurea-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    needs: verificar-web
    name: Construir instalador Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Compilar instalador
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Verificar archivo EXE
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path desktop/dist/*.exe -ErrorAction Stop
          if (-not $files -or ($files | Measure-Object -Property Length -Sum).Sum -le 0) {
            throw 'No se generó el instalador'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Aurea-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
