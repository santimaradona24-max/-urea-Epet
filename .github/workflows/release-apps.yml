name: Publicar actualización nativa Áurea

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'desktop/**'
      - '.github/workflows/release-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Construir Windows y metadatos de actualización
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Generar instalador NSIS y latest.yml
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Verificar metadatos e instalador
        shell: pwsh
        run: |
          if (-not (Test-Path desktop/dist/latest.yml)) { throw 'Falta latest.yml' }
          if (-not (Get-ChildItem desktop/dist/*.exe -ErrorAction SilentlyContinue)) { throw 'Falta el instalador Windows' }
      - uses: actions/upload-artifact@v4
        with:
          name: aurea-release-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

  android:
    name: Compilar APK de actualización firmado
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar solo con clave privada estable
        env:
          KS_BASE64: ${{ secrets.AUREA_ANDROID_KEYSTORE_B64 }}
          AUREA_ANDROID_STORE_PASSWORD: ${{ secrets.AUREA_ANDROID_STORE_PASSWORD }}
          AUREA_ANDROID_KEY_ALIAS: ${{ secrets.AUREA_ANDROID_KEY_ALIAS }}
          AUREA_ANDROID_KEY_PASSWORD: ${{ secrets.AUREA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KS_BASE64" || -z "$AUREA_ANDROID_STORE_PASSWORD" || -z "$AUREA_ANDROID_KEY_ALIAS" || -z "$AUREA_ANDROID_KEY_PASSWORD" ]]; then
            echo "No se publica un APK actualizable sin clave de firma permanente. Configurá los 4 secretos de repositorio."
            exit 0
          fi
          umask 077
          echo "$KS_BASE64" | base64 --decode > android/app/aurea-release.jks
          export AUREA_ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/android/app/aurea-release.jks"
          gradle -p android --no-daemon :app:assembleRelease
          VERSION=$(node -p "require('./desktop/package.json').version")
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/app-release.apk "release-android/Aurea-Android-v$VERSION.apk"
          test -s "release-android/Aurea-Android-v$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: aurea-release-android
          path: release-android/*.apk
          if-no-files-found: ignore

  publish:
    name: Crear GitHub Release público
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aurea-release-*
          path: publish
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publicar versión solo si aún no existe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v$VERSION"
          test -s publish/latest.yml
          find publish -maxdepth 1 -type f -printf '%f (%s bytes)\n'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG ya existe. Para una actualización nativa nueva, aumentá ambas versiones."
            exit 0
          fi
          gh release create "$TAG" publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Áurea $TAG" \
            --notes "Actualización nativa de Áurea. Windows: instalador NSIS con actualización integrada. Android: APK solo si se configuró la firma permanente. El contenido web se actualiza por Vercel."
