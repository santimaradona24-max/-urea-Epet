plugins {
    id 'com.android.application'
}
android {
    namespace 'ar.edu.epet6.aurea'
    compileSdk 35
    defaultConfig {
        applicationId 'ar.edu.epet6.aurea'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            if (System.getenv("AUREA_ANDROID_KEYSTORE_FILE")) {
                storeFile file(System.getenv("AUREA_ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("AUREA_ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("AUREA_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("AUREA_ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
