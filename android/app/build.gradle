plugins {
    id 'com.android.application'
}
android {
    namespace 'ar.edu.epet6.aurea'
    compileSdk 35
    defaultConfig {
        applicationId 'ar.edu.epet6.aurea'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
